before_build:
- ver
- timecli --version
- python --version
- .venv/Scripts/pip --version

build_script: skip

cache:
- "%LOCALAPPDATA%\\npm-cache"

clone_depth: 1

environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

image: Visual Studio 2022

install:
- choco install python --yes
- npm install --global timecli
- python -m venv .venv
- .venv/Scripts/python -m pip install --upgrade pip
- timecli ".venv/Scripts/pip" install --no-cache-dir --requirement requirements.txt
- timecli ".venv/Scripts/pip" install hello-world --no-cache-dir
- timecli ".venv/Scripts/pip" uninstall hello-world --no-cache-dir --yes

platform: x64
