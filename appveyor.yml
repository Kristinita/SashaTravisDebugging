before_build:
- node --version
- npx flow --version
- npx flow-typed --version

build_script:
- npx flow kira-example.js

cache:
- "%LOCALAPPDATA%\\npm-cache"

clone_depth: 1

environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

image: Visual Studio 2022

install:
- choco install nodejs --yes
- npm install --save-dev flow-bin flow-typed
- npx flow init
- npx flow-typed install

platform: x64
