before_script:
- cat /etc/os-release | grep "VERSION"
- python --version
- .venv/bin/pip --version

cache:
  directories:
  - $HOME/.npm

dist: noble

git:
  depth: 1

install:
- sudo add-apt-repository ppa:deadsnakes/ppa --yes
- sudo apt-get update --yes
- sudo apt-get install python3.14 --yes
- npm install --global @choksheak/timecli
- python -m venv .venv
- .venv/bin/python -m pip install --upgrade pip
- timecli ".venv/bin/pip" install --no-cache-dir --requirement requirements.txt
- timecli ".venv/bin/pip" install hello-world --no-cache-dir
- timecli ".venv/bin/pip" uninstall hello-world --no-cache-dir --yes

language: generic

os: linux

python: 3.14

script: skip
